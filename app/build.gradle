import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'com.google.devtools.ksp'

android {
    namespace 'com.hy.myapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.hy.baseapp"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        // 架构已切换为 ViewBinding + 协程,不再使用 DataBinding(2026-10)
        viewBinding true
        // AGP 9 默认不再生成 BuildConfig，需显式开启
        buildConfig true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

// Room 导出 schema 到 app/schemas,供迁移与 androidTest 校验使用
ksp {
    arg("room.schemaLocation", "$projectDir/schemas".toString())
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    // ViewPager2:Banner 轮播控件的翻页载体。显式声明而不是只依赖 material 的传递依赖,
    // 版本与 material 1.13.0 传递依赖对齐(1.0.0),避免依赖解冲突。
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
    implementation 'org.jetbrains:annotations:26.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'androidx.palette:palette-ktx:1.0.0'

    // rxJava and retrofit
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'io.reactivex:rxandroid:1.2.1'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava:3.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.1.0'

    implementation 'com.trello:rxlifecycle:1.0'
    implementation 'com.trello:rxlifecycle-android:1.0'
    implementation 'com.trello:rxlifecycle-components:1.0'

    implementation 'javax.inject:javax.inject:1'
    // kotlin
    // noinspection DifferentStdlibGradleVersion
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.18.0'
    // kotlin 协程
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    implementation 'com.squareup.okhttp3:okhttp-urlconnection:5.1.0'
    implementation 'com.github.franmontiel:PersistentCookieJar:v1.0.1'

    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'commons-io:commons-io:2.22.0'

    // 本地键值存储:MMKV
    implementation 'com.tencent:mmkv:2.4.3'

    // Room 关系数据库:runtime + ktx(Flow/协程),编译期由 KSP 生成 DAO 实现
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    // 图片加载
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'com.blankj:utilcodex:1.31.1'
    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.1.2'
    // BRVAH 4.x：包名由 com.chad.library.adapter.base 改为 com.chad.library.adapter4
    implementation 'io.github.cymchad:BaseRecyclerViewAdapterHelper4:4.4.1'
}
